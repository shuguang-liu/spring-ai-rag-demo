spring:
  DataSource:
    url: jdbc:postgresql://192.168.42.128:15432/ai_demo
    username: postgres
    password: ${DB_PASSWORD}
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.8-2.4t-a95b
      embedding:
        options:
          model: qwen3.7-text-embedding-flash
          # sk-vvipvgourebzpveaaqrqilgkpxtitlnlhobbuvjxazyydevq
    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1024
        initialize-schema: true

server:
  port: 9092

rag:
  retrievers:
    top-k: 20
    similarity-threshold: 0.2
  rerank:
    enable: true
    top-n: 5
    model: qwen3.7-text-rerank

file:
  path: docs/note